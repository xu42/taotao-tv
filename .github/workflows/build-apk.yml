name: Build APK

# 打 tag（v*）时自动编译并上传 APK 到该 tag 的 Release；
# 推送到 main / PR 时只做编译校验并留存产物；
# 也可在 Actions 页面手动触发。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 安装网页构建依赖
        working-directory: web/tv-web
        run: npm install --no-audit --no-fund

      - name: 构建内置网页资源
        run: node scripts/build-web.js

      - name: 准备签名密钥
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "检测到签名密钥，使用正式签名编译 release APK"
            mkdir -p android/keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
            {
              echo "RELEASE_STORE_FILE=../keystore/release.jks"
              echo "RELEASE_STORE_PASSWORD=$KS_PASS"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASS"
            } > android/local.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "未配置签名密钥（RELEASE_KEYSTORE_BASE64），将自动回退 debug 签名，产物同样可直接安装"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 编译 Release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: 整理产物
        id: collect
        run: |
          mkdir -p out
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "未找到编译产物" >&2
            exit 1
          fi
          NAME="$(basename "$APK")"
          cp "$APK" "out/$NAME"
          cp "$APK" "out/taotao-tv.apk"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh out/

      - name: 上传构建产物（Actions 页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: out/*.apk
          retention-days: 14

      - name: 发布到 tag 对应的 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/taotao-tv-*.apk
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
