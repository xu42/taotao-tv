plugins {
    alias(libs.plugins.android.application)
}

ext{
    rxhttp_version = "3.2.6"
    okhttp_version = "3.12.13"
    room_version = "2.6.1"
}
// 从 local.properties 读取签名配置
def keystorePropertiesFile = rootProject.file("local.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
// 只有当签名文件真实存在时才使用正式签名，否则回退到 debug 签名，
// 保证在没有密钥的机器 / CI 上 assembleRelease 也能产出可安装的 APK。
def releaseStoreFile = keystoreProperties['RELEASE_STORE_FILE'] ? file(keystoreProperties['RELEASE_STORE_FILE']) : null
def hasReleaseSigning = releaseStoreFile != null && releaseStoreFile.exists()

// ------------------------------------------------------------------ 版本号
// 版本号不再写死，默认按「编译的那一刻」生成：
//   versionName = yyyyMMdd.HHmm   精确到分钟，APK 文件名也会带上
//   versionCode = yyMMddHH        单调递增（每小时的编码都比上一天大），不会溢出 int
// 需要复现某次构建时可以覆盖：
//   ./gradlew assembleRelease -PbuildTime=2026-09-18T16:30
//   ./gradlew assembleRelease -PversionName=1.0.0 -PversionCode=100000
def resolveBuildTime = {
    def raw = project.findProperty('buildTime')
    if (raw) {
        for (pattern in ['yyyy-MM-dd\'T\'HH:mm', 'yyyy-MM-dd HH:mm', 'yyyyMMddHHmm']) {
            try {
                return new java.text.SimpleDateFormat(pattern).parse(raw.toString())
            } catch (Exception ignore) {
            }
        }
        logger.warn("buildTime \"${raw}\" 无法解析，改用当前时间")
    }
    return new Date()
}()
def tz = TimeZone.getTimeZone('Asia/Shanghai')
def buildVersionName = project.findProperty('versionName')
        ? project.property('versionName').toString()
        : resolveBuildTime.format('yyyyMMdd.HHmm', tz)
def buildVersionCode = project.findProperty('versionCode')
        ? project.property('versionCode').toString().toInteger()
        : resolveBuildTime.format('yyMMddHH', tz).toInteger()

// 按 CPU 架构拆包（可选）：默认关闭。
// 本工程没有任何 .so（纯 Java + 内置网页），拆出来的包内容完全一样，
// 所以默认只产出一个通用包；将来引入原生库后执行
//   ./gradlew assembleRelease -PabiSplit
// 即可同时得到 armeabi-v7a / arm64-v8a / x86 / x86_64 分包 + 通用包。
def enableAbiSplit = project.hasProperty('abiSplit')

android {
   /* flavorDimensions= ["env"]
    productFlavors {
        dev {
            buildConfigField('String', 'BUILD_ENV_TYPE', '"dev"')
        }
        pro  {
            buildConfigField('String', 'BUILD_ENV_TYPE', '"pro"')
        }
    }*/
    namespace 'com.xu42.tv.live'
    compileSdk 34

    // 签名配置（从 local.properties 读取；无密钥时回退 debug 签名）
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseStoreFile
                storePassword keystoreProperties['RELEASE_STORE_PASSWORD']
                keyAlias keystoreProperties['RELEASE_KEY_ALIAS']
                keyPassword keystoreProperties['RELEASE_KEY_PASSWORD']
            }
        }
    }
    buildFeatures {
        buildConfig = true
        dataBinding = true
        viewBinding = true
    }
    // 按 CPU 架构拆包（-PabiSplit 时生效；详见文件顶部说明）
    // 两个坑（AGP 8.12 实测）：
    //  1) 这里不能调用 reset()——AGP 内部 isAbiEnabled() = !isReset && enable，
    //     只要出现过一次 reset() 拆包就被永久关掉，enable 读到 true 也没用。
    //  2) splits.abi.include(...) 已经是空实现（写了不报错、但完全不生效），
    //     AGP 会按支持的 8 个 ABI 全量出包，所以要靠 exclude 把用不到的摘掉。
    splits {
        abi {
            enable enableAbiSplit
            exclude 'armeabi', 'mips', 'mips64', 'riscv64'
            universalApk true
        }
    }
    defaultConfig {
        applicationId "com.xu42.tv.live"
        minSdk 16
        //noinspection ExpiredTargetSdkVersiotv
        targetSdk 28
        // 版本号按编译时间生成，见文件顶部
        versionCode buildVersionCode
        versionName buildVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // 只保留中英文资源，其余语言包直接裁掉
        resConfigs "zh", "en"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation"  : "$projectDir/schemas".toString(),
                        "room.incremental"     : "true",
                        "room.expandProjection": "true"]
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            buildConfigField('String', 'BUILD_ENV_TYPE', '"dev"')
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            // 体积大头在 dex（约 5MB 未压缩），开启 R8 后才真正瘦下来
            minifyEnabled true
            shrinkResources true
            buildConfigField('String', 'BUILD_ENV_TYPE', '"pro"')
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // 去掉打进包里的构建元数据 / 许可文件
    packaging {
        resources {
            excludes += [
                    'META-INF/*.version',
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/*.kotlin_module',
                    'DebugProbesKt.bin',
                    'kotlin/**',
            ]
        }
    }
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    android.applicationVariants.all {
        variant ->
            variant.outputs.all {
                variantOutput ->
                    // 拆包时给 APK 文件名加上 CPU 架构后缀（通用包不加）。
                    // 坑：闭包里不能直接写 output.getFilter("ABI")——那个标识符并不存在，
                    // 会抛 MissingPropertyException，一旦被 catch 吞掉，所有分包就会重名互相覆盖，
                    // 最终只剩一个文件（甚至写出损坏的 zip）。必须用显式的闭包参数。
                    def abiName = ""
                    try {
                        def abi = variantOutput.getFilter("ABI")
                        if (abi != null) {
                            abiName = abi
                        } else {
                            def abiFilter = variantOutput.filters.find { it.filterType == "ABI" }
                            if (abiFilter != null) {
                                abiName = abiFilter.identifier
                            }
                        }
                    } catch (Throwable ignore) {
                    }
                    def abiSuffix = abiName.isEmpty() ? "" : "-${abiName}"
                    outputFileName = "taotao-tv-${variant.versionName}${abiSuffix}.apk"
            }
    }
    lint {
        // 仅为打包放行该规则；如不上架 Play 可保留 targetSdk 28
        checkReleaseBuilds false
        abortOnError false
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    implementation 'com.qiniu:happy-dns:2.0.1'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
    implementation "androidx.room:room-runtime:$room_version"
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    annotationProcessor "androidx.room:room-compiler:$room_version"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    testImplementation libs.junit
}